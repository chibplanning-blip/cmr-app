name: Build Jarvis debug APK

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarvis-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure required Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: jarvis-android/app/build/outputs/apk/debug/*.apk

      - name: Publish APK as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view jarvis-debug-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create jarvis-debug-latest \
              --repo "$GITHUB_REPOSITORY" \
              --title "Jarvis - dernier APK debug" \
              --notes "Build automatique depuis main (${{ github.sha }})."
          gh release upload jarvis-debug-latest \
            app/build/outputs/apk/debug/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
